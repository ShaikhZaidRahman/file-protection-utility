[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileprotect"
version = "1.0.0"
description = "Command-line file encryption with AES-256-GCM and PBKDF2-HMAC-SHA256"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["cryptography>=42.0"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fileprotect = "fileprotect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests
per-file-ignores = { "tests/*" = ["S105", "S106", "S108"] }
